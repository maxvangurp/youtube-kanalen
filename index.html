const nf = new Intl.NumberFormat('nl-NL');

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function delta(nu, voor) {
  if (!voor) return nu ? '<span class="d op">nieuw</span>' : '<span class="d nul">–</span>';
  const p = (nu - voor) / voor * 100;
  const k = p > 0.5 ? 'op' : p < -0.5 ? 'neer' : 'nul';
  return `<span class="d ${k}">${p > 0 ? '+' : ''}${p.toFixed(0)}%</span>`;
}
function grafiek(reeks, kleur) {
  if (!reeks.length) return '<div class="leeg">Nog geen data in deze periode.</div>';
  const w = 300, h = 80, max = Math.max(1, ...reeks.map((r) => r.weergaven));
  const bw = w / reeks.length;
  const staven = reeks.map((r, i) => {
    const bh = Math.max(1, r.weergaven / max * (h - 4));
    return `<rect x="${(i * bw + 1).toFixed(1)}" y="${(h - bh).toFixed(1)}" width="${Math.max(1, bw - 2).toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5" fill="${kleur}"><title>${r.dag}: ${fmt(r.weergaven)} weergaven</title></rect>`;
  }).join('');
  return `<svg class="grafiek" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${staven}</svg>`;
}
function sinds(iso) {
  const d = (Date.now() - Date.parse(iso)) / 36e5;
  if (d < 1) return 'zojuist';
  if (d < 24) return `${Math.round(d)} uur geleden`;
  const dg = Math.round(d / 24);

}

  const laatst = `<div class="laatst">${w.laatst ? `Laatst gewerkt ${sinds(w.laatst.datum)}: <code>${esc(w.laatst.onderwerp)}</code> · ` : ''}<code>${esc(w.map)}</code></div>`;
  const n = w.open?.length || 0;
  return `<div class="werk"><div class="chips"><span class="lbl">Start</span>${chips}</div>
    <details><summary>Skills${n ? ` · ${n} open punt${n === 1 ? '' : 'en'}` : ''}</summary><div class="uitleg">${uitleg}</div>${open}${laatst}</details></div>`;
}
function strook() {
  const nu = Date.now();
  const items = [];
  for (const k of DATA.kanalen) for (const v of (k.videos || [])) {
    const gepland = v.gepland && Date.parse(v.gepland) > nu;
    if (v.status !== 'public' && !gepland) continue;
    items.push({ k, v, gepland, t: Date.parse(gepland ? v.gepland : v.gepubliceerd) });
  }
  const komend = items.filter((i) => i.gepland).sort((a, b) => a.t - b.t);
  const live = items.filter((i) => !i.gepland).sort((a, b) => b.t - a.t).slice(0, 12);
  const kaart = ({ k, v, gepland, t }) => {
    const d = k.live?.perVideo?.[v.id];
    const url = gepland ? `https://studio.youtube.com/video/${v.id}/edit` : `https://www.youtube.com/watch?v=${v.id}`;
    const uur = (nu - t) / 36e5;
    const badge = gepland
      ? `<span class="badge gepland">Live ${new Date(t).toLocaleString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</span>`
      : uur < 48 ? `<span class="badge">${uur < 1 ? 'Net live' : 'Live · ' + sinds(new Date(t).toISOString())}</span>` : '';
    return `<a class="vid" style="--accent:${k.kleur}" href="${url}" target="_blank" rel="noopener">
      <div class="beeld" style="background-image:url('${esc(v.thumb)}')">${badge}<span class="kn" style="border-left:3px solid ${k.kleur}">${esc(k.naam)}</span></div>
      <div class="tx"><div class="ti">${esc(v.titel)}</div>
      <div class="sub"><span>${gepland ? 'ingepland' : sinds(new Date(t).toISOString())}</span><span>${d ? `<span class="plus">+${fmt(d)}</span> · ` : ''}${gepland ? '' : fmt(v.weergaven) + ' weergaven'}</span></div></div></a>`;
  };
  const el = document.getElementById('strook');
  el.innerHTML = [...komend, ...live].map(kaart).join('') || '<div class="leeg">Nog niets live.</div>';
}
function kanaalKaart(k) {
  const studio = `https://studio.youtube.com/channel/${k.id}`;
  const kop = `<div class="kop"><span class="streep" style="background:${k.kleur}"></span>
    ${k.avatar ? `<img src="${esc(k.avatar)}" alt="">` : ''}
    <div style="flex:1"><h2>${esc(k.titel || k.naam)}</h2>
    <a href="${studio}" target="_blank">Studio</a><a href="${studio}/analytics/tab-overview/period-default" target="_blank">Analytics</a><a href="https://www.youtube.com/channel/${k.id}" target="_blank">Kanaal</a></div></div>`;
  if (k.fout) return `<article class="kanaal" id="k-${k.sleutel}" style="--accent:${k.kleur}">${kop}<div class="fout">${esc(k.fout)}</div>${werkplaats(k)}</article>`;
  const p = k.periode, v = k.vorigePeriode;
  const netto = (p.subscribersGained || 0) - (p.subscribersLost || 0);
  const nettoV = (v.subscribersGained || 0) - (v.subscribersLost || 0);
  const nu = Date.now();
  const klaar = k.videos.filter((x) => x.status !== 'public' || (x.gepland && Date.parse(x.gepland) > nu))
    .sort((a, b) => (a.gepland || a.gepubliceerd).localeCompare(b.gepland || b.gepubliceerd));
  const recent = k.videos.filter((x) => x.status === 'public').slice(0, 5);
  const regel = (x, rechts) => `<li><img src="${esc(x.thumb)}" alt=""><span class="t"><a href="https://studio.youtube.com/video/${x.id}/edit" target="_blank">${esc(x.titel)}</a></span>${rechts}</li>`;
  return `<article class="kanaal" id="k-${k.sleutel}" style="--accent:${k.kleur}">${kop}
    <div class="cijfers">
      <div><div class="l">Abonnees</div><div class="w">${fmt(k.abonnees)}</div><span class="d ${netto > 0 ? 'op' : netto < 0 ? 'neer' : 'nul'}">${netto > 0 ? '+' : ''}${fmt(netto)} in 28 d</span></div>
      <div><div class="l">Weergaven</div><div class="w">${fmt(p.views)}</div>${delta(p.views, v.views)}</div>
      <div><div class="l">Kijkuren</div><div class="w">${uren(p.estimatedMinutesWatched)}</div>${delta(p.estimatedMinutesWatched, v.estimatedMinutesWatched)}</div>
    </div>
    ${liveRegel(k)}
    <div class="blok"><h3>Weergaven per dag (Analytics)</h3>${grafiek(k.perDag, k.kleur)}</div>
    <div class="blok"><h3>Klaar of ingepland</h3>${klaar.length ? '<ul>' + klaar.map((x) => regel(x,
      x.gepland ? `<span class="label gepland">${new Date(x.gepland).toLocaleString('nl-NL', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</span>`
                : `<span class="label">${x.status === 'private' ? 'privé' : x.status === 'unlisted' ? 'verborgen' : x.status}</span>`)).join('') + '</ul>' : '<div class="leeg">Niets ingepland of privé.</div>'}</div>
    <div class="blok"><h3>Best bekeken (28 d)</h3>${k.top.length ? '<ol>' + k.top.slice(0, 5).map((t) => {
      const x = k.videos.find((y) => y.id === t.id) || { id: t.id, titel: t.titel, thumb: `https://i.ytimg.com/vi/${t.id}/mqdefault.jpg` };
      return regel(x, `<span class="n">${fmt(t.weergaven)} · ${Math.round(t.kijkpct)}%</span>`);
    }).join('') + '</ol>' : '<div class="leeg">Nog geen weergaven in deze periode.</div>'}</div>
    <div class="blok"><h3>Laatst gepubliceerd</h3>${recent.length ? '<ul>' + recent.map((x) => { const d = k.live?.perVideo?.[x.id]; return regel(x, `<span class="n">${d ? `<span class="plus">+${fmt(d)}</span> · ` : ''}${fmt(x.weergaven)}</span>`); }).join('') + '</ul>' : '<div class="leeg">Nog niets openbaar.</div>'}</div>
    ${werkplaats(k)}
  </article>`;
}
if (!DATA) {
  document.getElementById('kanalen').innerHTML = '<div class="leeg">Nog geen data. Draai: node ververs.mjs</div>';
} else {
  const ok = DATA.kanalen.filter((k) => !k.fout);
  const som = (f) => ok.reduce((s, k) => s + (f(k) || 0), 0);
  document.getElementById('meta').innerHTML =
    `<span class="meta-lang">Analytics ${DATA.van} t/m ${DATA.tot} (YouTube loopt 1-2 dagen achter; % = t.o.v. 28 dagen ervoor) · </span>Bijgewerkt ${new Date(DATA.bijgewerkt).toLocaleString('nl-NL', { dateStyle: 'medium', timeStyle: 'short' })}`;
  const tegel = (l, w, d = '') => `<div class="tegel"><div class="l">${l}</div><div class="w">${w}</div>${d}</div>`;
  document.getElementById('totaal').innerHTML =
    tegel('Abonnees', fmt(som((k) => k.abonnees))) +
    tegel('Live', ok.some((k) => k.live) ? '+' + fmt(som((k) => k.live?.weergaven)) : '–', '<span class="d nul">weergaven, bijna realtime</span>') +
    tegel('Weergaven 28d', fmt(som((k) => k.periode.views)), delta(som((k) => k.periode.views), som((k) => k.vorigePeriode.views))) +
    tegel('Kijkuren 28d', uren(som((k) => k.periode.estimatedMinutesWatched)), delta(som((k) => k.periode.estimatedMinutesWatched), som((k) => k.vorigePeriode.estimatedMinutesWatched))) +
    tegel('Ingepland', fmt(som((k) => k.videos.filter((x) => x.status !== 'public').length))) +
    tegel('Video\'s', fmt(som((k) => k.aantalVideos)));
  document.getElementById('kanalen').innerHTML = DATA.kanalen.map(kanaalKaart).join('');
  strook();
  document.getElementById('nav').innerHTML = DATA.kanalen.map((k) => `<a href="#k-${k.sleutel}" style="--accent:${k.kleur}">${esc(k.naam)}</a>`).join('');
  document.querySelectorAll('[data-sc]').forEach((b) => b.addEventListener('click', () => document.getElementById('strook').scrollBy({ left: +b.dataset.sc * 540, behavior: 'smooth' })));
}
const toast = Object.assign(document.createElement('div'), { className: 'toast' });
document.body.appendChild(toast);
document.addEventListener('click', async (e) => {
  const b = e.target.closest('.skill');
  if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.start); toast.textContent = 'Gekopieerd, plak in Claude'; }
  catch { toast.textContent = b.dataset.start; }
  toast.classList.add('aan'); clearTimeout(toast._t); toast._t = setTimeout(() => toast.classList.remove('aan'), 1600);
});
</script>
</body>
