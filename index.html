  yt: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2 26 26 0 0 0 2 12a26 26 0 0 0 .4 4.8 2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8A26 26 0 0 0 22 12a26 26 0 0 0-.4-4.8ZM10 15V9l5.2 3Z"/></svg>',
};
let filter = 'ALLE';
const kanalen = () => (DATA?.kanalen || []).filter((k) => filter === 'ALLE' || k.sleutel === filter);
const ok = () => kanalen().filter((k) => !k.fout);
const som = (f) => ok().reduce((s, k) => s + (f(k) || 0), 0);
const vind = (s) => DATA.kanalen.find((x) => x.sleutel === s);

function sinds(iso) {
  const d = (Date.now() - Date.parse(iso)) / 36e5;
  if (d < 1) return 'zojuist';
  if (d < 24) return `${Math.round(d)} uur geleden`;
  const dg = Math.round(d / 24);
  return dg === 1 ? 'gisteren' : `${dg} dagen geleden`;
}
function delta(nu, voor, lang) {
  if (!voor) return nu ? '<span class="d op">nieuw</span>' : '<span class="d nul">–</span>';
  const p = (nu - voor) / voor * 100;
  const k = p > 0.5 ? 'op' : p < -0.5 ? 'neer' : 'nul';
  return `<span class="d ${k}">${p > 0.5 ? '↑' : p < -0.5 ? '↓' : ''} ${Math.abs(p).toFixed(0)}%${lang ? ' <span class="nul" style="font-weight:500">vs vorige 28d</span>' : ''}</span>`;
}
function telOp(el, doel, opmaak) {
  const start = performance.now(), duur = 750;
  const stap = (t) => { const p = Math.min(1, (t - start) / duur); el.textContent = opmaak(doel * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(stap); };
  requestAnimationFrame(stap);
}

/* Gestapelde staafgrafiek per dag, met tooltip (muis en vinger) */
function teken(el, reeksen, metriek, compact) {
  const dagen = [...new Set(reeksen.flatMap((r) => r.data.map((d) => d.dag)))].sort();
  if (!dagen.length) { el.innerHTML = '<div class="leeg">Nog geen data in deze periode.</div>'; el.onpointermove = null; return; }
  const waarde = (d) => !d ? 0 : metriek === 'minuten' ? d.minuten / 60 : d[metriek];
  const per = dagen.map((dag) => reeksen.map((r) => Math.max(0, waarde(r.data.find((d) => d.dag === dag)))));
  const totaal = per.map((a) => a.reduce((s, x) => s + x, 0));
  const max = Math.max(...totaal);
  if (!max) { el.innerHTML = '<div class="leeg">Nog geen ' + ({ weergaven: 'weergaven', minuten: 'kijktijd', erbij: 'nieuwe abonnees' }[metriek]) + ' in deze periode.</div>'; el.onpointermove = null; return; }
  const W = 600, H = compact ? 90 : 170, gap = compact ? 2 : 3, bw = W / dagen.length;
  let svg = '';
  if (!compact) for (let i = 1; i <= 3; i++) svg += `<line x1="0" x2="${W}" y1="${(H - H * i / 3.2).toFixed(1)}" y2="${(H - H * i / 3.2).toFixed(1)}" stroke="rgba(255,255,255,.05)"/>`;
  per.forEach((a, i) => {
    let y = H;
    a.forEach((v, j) => {
      const h = v / max * (H - 8);
      if (h <= 0) return;
      y -= h;
      svg += `<rect x="${(i * bw + gap / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1, bw - gap).toFixed(1)}" height="${h.toFixed(1)}" rx="${compact ? 1.5 : 2.5}" fill="${reeksen[j].kleur}" opacity=".9"/>`;
    });
  });
  svg += `<rect class="cursor" x="0" y="0" width="${bw.toFixed(1)}" height="${H}" fill="rgba(255,255,255,.06)" opacity="0"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${svg}</svg><div class="tip"></div>`;
  const tip = $('.tip', el), cur = $('.cursor', el);
  const eenheid = { weergaven: 'weergaven', minuten: 'kijkuren', erbij: 'abonnees erbij' }[metriek];
  el.onpointermove = (e) => {
    const r = el.getBoundingClientRect();
    const i = Math.min(dagen.length - 1, Math.max(0, Math.floor((e.clientX - r.left) / r.width * dagen.length)));
    const d = new Date(dagen[i] + 'T12:00').toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' });
    tip.innerHTML = `${metriek === 'minuten' ? totaal[i].toLocaleString('nl-NL', { maximumFractionDigits: 1 }) : fmt(totaal[i])} ${eenheid}<span>${d}</span>`;
    tip.style.left = `${Math.min(Math.max((i + .5) / dagen.length * r.width, 60), r.width - 60)}px`;
    tip.style.opacity = 1;
    cur.setAttribute('x', (i * bw).toFixed(1)); cur.setAttribute('opacity', 1);
  };
  el.onpointerleave = () => { tip.style.opacity = 0; cur.setAttribute('opacity', 0); };
}

function vulKop() {
  const t = new Date(DATA.bijgewerkt);
  $('#pilTxt').textContent = `Bijgewerkt ${t.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' })}`;
  $('#pil').title = `Live-tellers van ${t.toLocaleString('nl-NL', { dateStyle: 'medium', timeStyle: 'short' })}. Grafieken en kijkuren komen uit YouTube Analytics, die 1-2 dagen achterloopt (t/m ${new Date(DATA.tot + 'T12:00').toLocaleDateString('nl-NL', { day: 'numeric', month: 'long' })}).`;
  $('#ondertitel').textContent = DATA.kanalen.map((k) => k.naam).join(' · ');
}
function vulFilter() {
  const knop = (s, naam, kleur, avatar) => `<button class="fk${avatar ? '' : ' zonder'}${filter === s ? ' aan' : ''}" data-f="${s}" style="--accent:${kleur}">${avatar ? `<img src="${esc(avatar)}" alt="">` : ''}${esc(naam)}</button>`;
  $('#filter').innerHTML = knop('ALLE', 'Alle kanalen', '#F4F4F6') + DATA.kanalen.map((k) => knop(k.sleutel, k.naam, k.kleur, k.avatar)).join('');
}
function vulKpis() {
  const live = ok().some((k) => k.live);
  const prive = som((k) => k.videos.filter((v) => v.status !== 'public').length);
  const kp = [
    ['Abonnees', som((k) => k.abonnees), fmt, (() => { const n = som((k) => k.periode.subscribersGained - k.periode.subscribersLost); return `<span class="d ${n > 0 ? 'op' : 'nul'}">${n > 0 ? '+' : ''}${fmt(n)} in 28d</span>`; })()],
    ['Live, laatste uren', live ? som((k) => k.live?.weergaven) : null, (v) => '+' + fmt(v), `<span class="d nul">${live ? 'weergaven, bijna realtime' : 'start bij volgende verversing'}</span>`],
    ['Video\'s', som((k) => k.aantalVideos), fmt, `<span class="d nul">${prive} ingepland of privé</span>`],
    ['Weergaven 28d', som((k) => k.periode.views), fmt, delta(som((k) => k.periode.views), som((k) => k.vorigePeriode.views), true)],
    ['Kijkuren 28d', som((k) => k.periode.estimatedMinutesWatched) / 60, (v) => v.toLocaleString('nl-NL', { maximumFractionDigits: 1 }), delta(som((k) => k.periode.estimatedMinutesWatched), som((k) => k.vorigePeriode.estimatedMinutesWatched), true)],
    ['Likes 28d', som((k) => k.periode.likes), fmt, `<span class="d nul">${fmt(som((k) => k.periode.comments))} reacties</span>`],
  ];
  $('#kpis').innerHTML = kp.map(([l, w, f, d], i) => `<div class="kpi"><div class="l">${l}</div><div class="w" data-i="${i}">${w == null ? '–' : f(0)}</div>${d}</div>`).join('');
  kp.forEach(([, w, f], i) => { if (w != null) telOp($(`.kpi .w[data-i="${i}"]`), w, f); });
}
let heroMetriek = 'weergaven';
function vulHero() {
  teken($('#heroGraf'), ok().map((k) => ({ kleur: k.kleur, data: k.perDag || [] })), heroMetriek, false);
  $('#grafTitel').textContent = { weergaven: 'Weergaven per dag', minuten: 'Kijkuren per dag', erbij: 'Abonnees erbij per dag' }[heroMetriek];
  $('#legenda').innerHTML = ok().map((k) => `<span><i style="background:${k.kleur}"></i>${esc(k.naam)}</span>`).join('');
}
function vulStrook() {
  const nu = Date.now(), items = [];
  for (const k of kanalen()) for (const v of (k.videos || [])) {
    const gepland = v.gepland && Date.parse(v.gepland) > nu;
    if (v.status !== 'public' && !gepland) continue;
    items.push({ k, v, gepland, t: Date.parse(gepland ? v.gepland : v.gepubliceerd) });
  }
  const lijst = [...items.filter((i) => i.gepland).sort((a, b) => a.t - b.t), ...items.filter((i) => !i.gepland).sort((a, b) => b.t - a.t).slice(0, 14)];
  $('#strook').innerHTML = lijst.map(({ k, v, gepland, t }) => {
    const d = k.live?.perVideo?.[v.id];
    const uur = (nu - t) / 36e5;
    const badge = gepland
      ? `<span class="badge gepland">◷ ${new Date(t).toLocaleString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</span>`
      : uur < 48 ? `<span class="badge">● ${uur < 1 ? 'Net live' : 'Live, ' + sinds(new Date(t).toISOString())}</span>` : '';
    const url = gepland ? `https://studio.youtube.com/video/${v.id}/edit` : `https://www.youtube.com/watch?v=${v.id}`;
    return `<a class="vid" style="--accent:${k.kleur}" href="${url}" target="_blank" rel="noopener">
      <div class="beeld"><img loading="lazy" src="${esc(v.thumb)}" alt="">${badge}<span class="kn">${k.avatar ? `<img src="${esc(k.avatar)}" alt="">` : ''}${esc(k.naam)}</span><span class="play"><b>▶</b></span></div>
      <div class="tx"><div class="ti">${esc(v.titel)}</div>
      <div class="sub"><span>${gepland ? 'Ingepland, opent Studio' : sinds(new Date(t).toISOString())}</span><span>${d ? `<span class="plus">+${fmt(d)}</span> · ` : ''}${gepland ? '' : fmt(v.weergaven) + ' weergaven'}</span></div></div></a>`;
  }).join('') || '<div class="leeg">Nog niets live.</div>';
}

function rij(v, rechts, meta) {
  const url = v.status === 'public' ? `https://www.youtube.com/watch?v=${v.id}` : `https://studio.youtube.com/video/${v.id}/edit`;
  return `<li><a href="${url}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(v.thumb || `https://i.ytimg.com/vi/${v.id}/mqdefault.jpg`)}" alt=""><div style="min-width:0"><div class="t">${esc(v.titel)}</div>${meta ? `<div class="m">${meta}</div>` : ''}</div><div class="r">${rechts}</div></a></li>`;
}
const isGepland = (v) => v.status !== 'public' || (v.gepland && Date.parse(v.gepland) > Date.now());
function tabInhoud(k, tab) {
  if (tab === 'top') {
    if (!k.top.length) return '<div class="leeg">Nog geen weergaven in de laatste 28 dagen.</div>';
    return '<ul>' + k.top.slice(0, 5).map((t) => {
      const v = k.videos.find((y) => y.id === t.id) || { id: t.id, titel: t.titel, status: 'public' };
      return rij(v, `${fmt(t.weergaven)}<small>${Math.round(t.kijkpct)}% bekeken</small>`, `${uren(t.minuten)} kijkuur`);
    }).join('') + '</ul>';
  }
  if (tab === 'recent') {
    const r = k.videos.filter((v) => v.status === 'public').slice(0, 6);
    if (!r.length) return '<div class="leeg">Nog niets openbaar.</div>';
    return '<ul>' + r.map((v) => { const d = k.live?.perVideo?.[v.id]; return rij(v, `${fmt(v.weergaven)}<small>${d ? `<span class="plus">+${fmt(d)}</span> recent` : 'weergaven'}</small>`, sinds(v.gepubliceerd)); }).join('') + '</ul>';
  }
  const g = k.videos.filter(isGepland).sort((a, b) => (a.gepland || a.gepubliceerd).localeCompare(b.gepland || b.gepubliceerd));
  if (!g.length) return '<div class="leeg">Niets ingepland of privé.</div>';
  return '<ul>' + g.map((v) => rij(v, v.gepland ? `<span class="label gepland">${new Date(v.gepland).toLocaleString('nl-NL', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</span>` : `<span class="label">${v.status === 'private' ? 'privé' : v.status === 'unlisted' ? 'verborgen' : v.status}</span>`, 'opent Studio')).join('') + '</ul>';
}
function werkplaats(k) {
  const w = k.werkplaats;
  if (!w) return '';
  const n = w.open?.length || 0;
  return `<div class="werk"><div class="chips">${w.skills.map((s) => `<button class="skill${s.tebouwen ? ' bouwen' : ''}" data-start="${esc(s.start)}" title="${esc(s.naam)}: klik om de startzin te kopiëren">${s.icoon} ${esc(s.start)}</button>`).join('')}</div>
    <details><summary>Skills en open punten${n ? ` (${n})` : ''}</summary>
    <div class="uitleg">${w.skills.map((s) => `<div><b>${esc(s.naam)}</b>${s.tebouwen ? ' (te bouwen)' : ''} · ${esc(s.wat)}</div>`).join('')}</div>
    ${n ? `<div class="open">${w.open.map((o) => `<span>${esc(o)}</span>`).join('')}</div>` : ''}
    <div class="laatst">${w.laatst ? `Laatst gewerkt ${sinds(w.laatst.datum)}: ${esc(w.laatst.onderwerp)} · ` : ''}${esc(w.map)}</div></details></div>`;
}
function kaart(k) {
  const studio = `https://studio.youtube.com/channel/${k.id}`;
  const kop = `<div class="kkop">${k.avatar ? `<img src="${esc(k.avatar)}" alt="">` : ''}<div style="min-width:0"><h3>${esc(k.titel || k.naam)}</h3><div class="rol">${esc(k.werkplaats?.rol || '')}</div></div>
    <div class="acties"><a class="ib" title="YouTube Studio" href="${studio}" target="_blank" rel="noopener">${ICON.studio}</a><a class="ib" title="Analytics" href="${studio}/analytics/tab-overview/period-default" target="_blank" rel="noopener">${ICON.stats}</a><a class="ib" title="Kanaal op YouTube" href="https://www.youtube.com/channel/${k.id}" target="_blank" rel="noopener">${ICON.yt}</a></div></div>`;
  if (k.fout) return `<article class="kaart fade" id="k-${k.sleutel}" style="--accent:${k.kleur}">${kop}<div class="fout">${esc(k.fout)}</div>${werkplaats(k)}</article>`;
  const p = k.periode, v = k.vorigePeriode, l = k.live;
  const netto = (p.subscribersGained || 0) - (p.subscribersLost || 0);
  const live = l
    ? `<div class="livebalk"><span class="stip"></span><span><b>+${fmt(l.weergaven)}</b> weergaven${l.abonnees ? ` · <b>${l.abonnees > 0 ? '+' : ''}${fmt(l.abonnees)}</b> abonnees` : ''}</span><span class="nul" style="margin-left:auto">laatste ${Math.max(1, Math.round((Date.parse(DATA.bijgewerkt) - Date.parse(l.sinds)) / 36e5))} uur</span></div>`
    : `<div class="livebalk wacht"><span class="stip"></span>Live-teller start bij de volgende verversing</div>`;
  const nG = k.videos.filter(isGepland).length;
  return `<article class="kaart fade" id="k-${k.sleutel}" style="--accent:${k.kleur}">${kop}
    <div class="kc">
      <div><div class="l">Abonnees</div><div class="w">${fmt(k.abonnees)}</div><span class="d ${netto > 0 ? 'op' : netto < 0 ? 'neer' : 'nul'}">${netto > 0 ? '+' : ''}${fmt(netto)} in 28d</span></div>
      <div><div class="l">Weergaven 28d</div><div class="w">${fmt(p.views)}</div>${delta(p.views, v.views)}</div>
      <div><div class="l">Kijkuren 28d</div><div class="w">${uren(p.estimatedMinutesWatched)}</div>${delta(p.estimatedMinutesWatched, v.estimatedMinutesWatched)}</div>
    </div>
    ${live}
    <div class="kgraf"><div class="graftop"><span class="z">Per dag</span><div class="seg" data-kseg="${k.sleutel}"><button data-m="weergaven" class="aan">Weergaven</button><button data-m="minuten">Uren</button><button data-m="erbij">Abo's</button></div></div><div class="graf" data-kgraf="${k.sleutel}"></div></div>
    <div class="tabs" data-ktab="${k.sleutel}"><button data-t="top" class="aan">Top 28d</button><button data-t="recent">Recent</button><button data-t="gepland">Ingepland${nG ? `<span class="n">${nG}</span>` : ''}</button></div>
    <div class="lijst" data-klijst="${k.sleutel}">${tabInhoud(k, 'top')}</div>
    ${werkplaats(k)}
  </article>`;
}
function vulKaarten() {
  $('#kanalen').innerHTML = kanalen().map(kaart).join('');
  for (const k of ok()) teken($(`[data-kgraf="${k.sleutel}"]`), [{ kleur: k.kleur, data: k.perDag || [] }], 'weergaven', true);
}
function alles() { vulFilter(); vulKpis(); vulHero(); vulStrook(); vulKaarten(); }

if (!DATA) { $('#kanalen').innerHTML = '<div class="leeg">Nog geen data. Draai: node ververs.mjs</div>'; }
else { vulKop(); alles(); }

const toast = $('#toast');
const melding = (t) => { toast.textContent = t; toast.classList.add('aan'); clearTimeout(toast._t); toast._t = setTimeout(() => toast.classList.remove('aan'), 1600); };
document.addEventListener('click', async (e) => {
  const f = e.target.closest('[data-f]');
  if (f) { filter = f.dataset.f; alles(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const sc = e.target.closest('[data-sc]');
  if (sc) { $('#strook').scrollBy({ left: +sc.dataset.sc * 600, behavior: 'smooth' }); return; }
  const hs = e.target.closest('#heroSeg button');
  if (hs) { heroMetriek = hs.dataset.m; $('#heroSeg').querySelectorAll('button').forEach((b) => b.classList.toggle('aan', b === hs)); vulHero(); return; }
  const ks = e.target.closest('[data-kseg] button');
  if (ks) { const s = ks.parentElement.dataset.kseg, k = vind(s); ks.parentElement.querySelectorAll('button').forEach((b) => b.classList.toggle('aan', b === ks)); teken($(`[data-kgraf="${s}"]`), [{ kleur: k.kleur, data: k.perDag || [] }], ks.dataset.m, true); return; }
  const kt = e.target.closest('[data-ktab] button');
  if (kt) { const s = kt.parentElement.dataset.ktab; kt.parentElement.querySelectorAll('button').forEach((b) => b.classList.toggle('aan', b === kt)); $(`[data-klijst="${s}"]`).innerHTML = tabInhoud(vind(s), kt.dataset.t); return; }
  const sk = e.target.closest('.skill');
  if (sk) { try { await navigator.clipboard.writeText(sk.dataset.start); melding('Gekopieerd, plak in Claude'); } catch { melding(sk.dataset.start); } }
});
</script>
